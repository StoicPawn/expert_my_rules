name: local-verify-deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expert-my-rules-local-main
  # A newer tested main supersedes an older deployment attempt. The deployment
  # never stops an IN_PROGRESS scientific task; cancelling an old waiter only
  # releases the self-hosted runner so the newest observer can be deployed.
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: [self-hosted, linux, expert-local]
    timeout-minutes: 120

    steps:
      - name: Choose trusted revision
        id: rev
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout trusted commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.rev.outputs.sha }}
          clean: true

      - name: Verify on mini-PC
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .gha-venv
          python3 -m venv .gha-venv
          export PATH="$PWD/.gha-venv/bin:$PATH"
          python -m pip install --upgrade pip
          pip install -e .
          python -m compileall -q src
          python -m unittest discover -s tests -v
          docker compose --env-file .env.example config >/dev/null

      - name: Deploy observer now and main only when already safe
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          DEPLOY_DIR: /home/stoicpawn/projects/expert_my_rules
        run: |
          set -euo pipefail
          test -d "$DEPLOY_DIR/.git"
          test -f "$DEPLOY_DIR/.env"

          CHANGED="$(git -C "$DEPLOY_DIR" diff --name-only)"
          if [ "$CHANGED" = "switch-inference.sh" ]; then
            WORKTREE_BLOB="$(git hash-object "$DEPLOY_DIR/switch-inference.sh")"
            INDEX_BLOB="$(git -C "$DEPLOY_DIR" rev-parse HEAD:switch-inference.sh)"
            if [ "$WORKTREE_BLOB" = "$INDEX_BLOB" ]; then
              git -C "$DEPLOY_DIR" checkout -- switch-inference.sh
            fi
          fi

          if [ -n "$(git -C "$DEPLOY_DIR" status --porcelain --untracked-files=no)" ]; then
            echo "Production checkout has tracked local changes; refusing to overwrite them."
            git -C "$DEPLOY_DIR" status --short
            exit 1
          fi

          git -C "$DEPLOY_DIR" fetch origin main
          git -C "$DEPLOY_DIR" checkout main
          git -C "$DEPLOY_DIR" reset --hard "${{ steps.rev.outputs.sha }}"

          docker network inspect home-lab >/dev/null 2>&1 || docker network create home-lab
          cd "$DEPLOY_DIR"
          MODE="$(awk -F= '$1=="AWB_INFERENCE_MODE" {print $2}' .env | tail -n1)"
          MODE="${MODE:-local}"
          PORT="$(awk -F= '$1=="AWB_PORT" {print $2}' .env | tail -n1)"
          PORT="${PORT:-8100}"
          OBSERVER_PORT="$(awk -F= '$1=="AWB_OBSERVER_PORT" {print $2}' .env | tail -n1)"
          OBSERVER_PORT="${OBSERVER_PORT:-8101}"

          if [ "$MODE" = "local" ]; then
            docker compose --env-file .env --profile local-inference build expert-my-rules
          elif [ "$MODE" = "remote" ]; then
            docker compose --env-file .env build expert-my-rules
          else
            echo "Unsupported AWB_INFERENCE_MODE=$MODE"
            exit 1
          fi

          # The observer is a separate read-only web process. Starting/replacing it
          # does not restart expert-my-rules and therefore cannot interrupt the
          # scientific model call currently running in that container.
          docker compose --env-file .env up -d --no-deps expert-observer
          OBSERVER_HEALTHY=0
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 3 "http://127.0.0.1:${OBSERVER_PORT}/health" >/dev/null; then
              OBSERVER_HEALTHY=1
              break
            fi
            sleep 2
          done
          if [ "$OBSERVER_HEALTHY" != "1" ]; then
            docker compose --env-file .env ps || true
            docker compose --env-file .env logs --tail=160 expert-observer || true
            exit 1
          fi
          echo "Research observer is live on port ${OBSERVER_PORT}."

          # If an older cancelled deploy left the actively-running project's job in
          # PAUSED state, resume only a paused job that still has an IN_PROGRESS task.
          # This preserves the user's current request that research keep moving.
          if docker compose --env-file .env ps -q expert-my-rules | grep -q .; then
            STALE_PAUSED="$RUNNER_TEMP/expert-stale-paused.tsv"
            docker compose --env-file .env exec -T expert-my-rules python - <<'PY' > "$STALE_PAUSED"
          import sqlite3
          from pathlib import Path
          root = Path('/data/workspaces')
          if root.exists():
              for db in root.glob('*/ledger.sqlite3'):
                  conn = sqlite3.connect(db, timeout=30)
                  try:
                      active = conn.execute("SELECT COUNT(*) FROM tasks WHERE status='IN_PROGRESS'").fetchone()[0]
                      if not active:
                          continue
                      rows = conn.execute("SELECT id FROM jobs WHERE continuous=1 AND status='PAUSED'").fetchall()
                      for (job_id,) in rows:
                          print(f"{db.parent.name}\t{job_id}")
                  finally:
                      conn.close()
          PY
            while IFS=$'\t' read -r slug jid; do
              [ -n "$slug" ] || continue
              curl -fsS -X POST "http://127.0.0.1:${PORT}/project/${slug}/job/${jid}/resume" -o /dev/null || true
              echo "Recovered previously paused active job ${jid} for ${slug}."
            done < "$STALE_PAUSED"
          fi

          # Do not wait hours inside GitHub Actions. If scientific work is active,
          # leave the main runtime untouched: the new production observer already
          # exposes the new UI, CPU/model telemetry and complete persisted outputs.
          ACTIVE=0
          if docker compose --env-file .env ps -q expert-my-rules | grep -q .; then
            ACTIVE="$(docker compose --env-file .env exec -T expert-my-rules python - <<'PY'
          import sqlite3
          from pathlib import Path
          total = 0
          root = Path('/data/workspaces')
          if root.exists():
              for db in root.glob('*/ledger.sqlite3'):
                  conn = sqlite3.connect(db, timeout=30)
                  try:
                      total += conn.execute("SELECT COUNT(*) FROM tasks WHERE status='IN_PROGRESS'").fetchone()[0]
                  finally:
                      conn.close()
          print(total)
          PY
            )"
            ACTIVE="$(printf '%s' "$ACTIVE" | tr -d '[:space:]')"
          fi
          if [ "$ACTIVE" != "0" ]; then
            echo "Main app restart deferred: ${ACTIVE} scientific task(s) are IN_PROGRESS."
            echo "Observer deployment succeeded; active research was not interrupted."
            exit 0
          fi

          # No scientific task is active right now. Pause continuous jobs to close
          # the small race in which a new task could start while the main container
          # is being replaced, then re-check before stopping anything.
          CANDIDATES="$RUNNER_TEMP/expert-safe-deploy-candidates.tsv"
          PAUSED_FILE="$RUNNER_TEMP/expert-safe-deploy-paused.tsv"
          : > "$CANDIDATES"
          : > "$PAUSED_FILE"
          if docker compose --env-file .env ps -q expert-my-rules | grep -q .; then
            docker compose --env-file .env exec -T expert-my-rules python - <<'PY' > "$CANDIDATES"
          import sqlite3
          from pathlib import Path
          root = Path('/data/workspaces')
          if root.exists():
              for db in root.glob('*/ledger.sqlite3'):
                  conn = sqlite3.connect(db, timeout=30)
                  try:
                      rows = conn.execute("SELECT id FROM jobs WHERE continuous=1 AND status='RUNNING'").fetchall()
                      for (job_id,) in rows:
                          print(f"{db.parent.name}\t{job_id}")
                  finally:
                      conn.close()
          PY
          fi

          resume_paused() {
            [ -s "$PAUSED_FILE" ] || return 0
            for _ in $(seq 1 30); do
              if curl -fsS --max-time 3 "http://127.0.0.1:${PORT}/" >/dev/null; then
                break
              fi
              sleep 2
            done
            while IFS=$'\t' read -r slug jid; do
              [ -n "$slug" ] || continue
              curl -fsS -X POST "http://127.0.0.1:${PORT}/project/${slug}/job/${jid}/resume" -o /dev/null || true
            done < "$PAUSED_FILE"
          }
          trap 'resume_paused || true' EXIT

          while IFS=$'\t' read -r slug jid; do
            [ -n "$slug" ] || continue
            curl -fsS -X POST "http://127.0.0.1:${PORT}/project/${slug}/job/${jid}/pause" -o /dev/null
            printf '%s\t%s\n' "$slug" "$jid" >> "$PAUSED_FILE"
          done < "$CANDIDATES"

          sleep 2
          ACTIVE_AFTER_PAUSE="$(docker compose --env-file .env exec -T expert-my-rules python - <<'PY'
          import sqlite3
          from pathlib import Path
          total = 0
          root = Path('/data/workspaces')
          if root.exists():
              for db in root.glob('*/ledger.sqlite3'):
                  conn = sqlite3.connect(db, timeout=30)
                  try:
                      total += conn.execute("SELECT COUNT(*) FROM tasks WHERE status='IN_PROGRESS'").fetchone()[0]
                  finally:
                      conn.close()
          print(total)
          PY
          )"
          ACTIVE_AFTER_PAUSE="$(printf '%s' "$ACTIVE_AFTER_PAUSE" | tr -d '[:space:]')"
          if [ "$ACTIVE_AFTER_PAUSE" != "0" ]; then
            echo "A scientific task entered IN_PROGRESS during the handoff; main restart deferred safely."
            resume_paused
            : > "$PAUSED_FILE"
            trap - EXIT
            exit 0
          fi

          docker compose --env-file .env stop expert-my-rules
          if [ "$MODE" = "local" ]; then
            docker compose --env-file .env --profile local-inference up -d --no-build --remove-orphans
          else
            docker compose --env-file .env up -d --no-build --remove-orphans
          fi

          HEALTHY=0
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 3 "http://127.0.0.1:${PORT}/" >/dev/null; then
              HEALTHY=1
              break
            fi
            sleep 2
          done
          if [ "$HEALTHY" != "1" ]; then
            docker compose --env-file .env ps || true
            docker compose --env-file .env logs --tail=160 expert-my-rules || true
            exit 1
          fi

          resume_paused
          : > "$PAUSED_FILE"
          trap - EXIT
          echo "Expert My Rules main app, observer, health checks and job resume OK."
