name: local-verify-deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expert-my-rules-local-main
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: [self-hosted, linux, expert-local]
    timeout-minutes: 90

    steps:
      - name: Choose trusted revision
        id: rev
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout trusted commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.rev.outputs.sha }}
          clean: true

      - name: Verify on mini-PC
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .gha-venv
          python3 -m venv .gha-venv
          export PATH="$PWD/.gha-venv/bin:$PATH"
          python -m pip install --upgrade pip
          pip install -e .
          python -m compileall -q src
          python -m unittest discover -s tests -v
          docker compose --env-file .env.example config >/dev/null

      - name: Deploy tested main
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          DEPLOY_DIR: /home/stoicpawn/projects/expert_my_rules
        run: |
          set -euo pipefail
          test -d "$DEPLOY_DIR/.git"
          test -f "$DEPLOY_DIR/.env"

          if [ -n "$(git -C "$DEPLOY_DIR" status --porcelain --untracked-files=no)" ]; then
            echo "Production checkout has tracked local changes; refusing to overwrite them."
            git -C "$DEPLOY_DIR" status --short
            exit 1
          fi

          git -C "$DEPLOY_DIR" fetch origin main
          git -C "$DEPLOY_DIR" checkout main
          git -C "$DEPLOY_DIR" reset --hard "${{ steps.rev.outputs.sha }}"

          docker network inspect home-lab >/dev/null 2>&1 || docker network create home-lab
          cd "$DEPLOY_DIR"
          MODE="$(awk -F= '$1=="AWB_INFERENCE_MODE" {print $2}' .env | tail -n1)"
          MODE="${MODE:-local}"

          if [ "$MODE" = "local" ]; then
            docker compose --env-file .env --profile local-inference up -d --build --remove-orphans
          elif [ "$MODE" = "remote" ]; then
            docker compose --env-file .env up -d --build --remove-orphans
          else
            echo "Unsupported AWB_INFERENCE_MODE=$MODE"
            exit 1
          fi

      - name: Health check
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          DEPLOY_DIR: /home/stoicpawn/projects/expert_my_rules
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          PORT="$(awk -F= '$1=="AWB_PORT" {print $2}' .env | tail -n1)"
          PORT="${PORT:-8100}"

          for _ in $(seq 1 60); do
            if curl -fsS --max-time 3 "http://127.0.0.1:${PORT}/" >/dev/null; then
              echo "Expert My Rules deploy and health check OK on port ${PORT}"
              exit 0
            fi
            sleep 2
          done

          docker compose --env-file .env ps || true
          docker compose --env-file .env logs --tail=120 expert-my-rules || true
          exit 1
