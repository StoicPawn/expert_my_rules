name: local-verify-deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expert-my-rules-local-main
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: [self-hosted, linux, expert-local]
    timeout-minutes: 45

    steps:
      - name: Choose trusted revision
        id: rev
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout trusted commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.rev.outputs.sha }}
          clean: true

      - name: Verify on mini-PC
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .gha-venv
          python3 -m venv .gha-venv
          export PATH="$PWD/.gha-venv/bin:$PATH"
          python -m pip install --upgrade pip
          pip install -e .
          python -m compileall -q src
          python -m unittest discover -s tests -v
          docker compose --env-file .env.example config >/dev/null
          bash -n ops/apply_acepc_resource_policy.sh

      - name: Deploy Control Center v2
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          DEPLOY_DIR: /home/stoicpawn/projects/expert_my_rules
        run: |
          set -euo pipefail
          test -d "$DEPLOY_DIR/.git"
          test -f "$DEPLOY_DIR/.env"

          FORCE_CANCEL=0
          if [ -f "$GITHUB_WORKSPACE/.force-cancel-active-research-once" ]; then
            FORCE_CANCEL=1
            echo "One-time forced research cancellation is authorized by this trusted revision."
          fi

          cd "$DEPLOY_DIR"
          CHANGED="$(git diff --name-only)"
          if [ "$CHANGED" = "switch-inference.sh" ]; then
            WORKTREE_BLOB="$(git hash-object switch-inference.sh)"
            INDEX_BLOB="$(git rev-parse HEAD:switch-inference.sh)"
            if [ "$WORKTREE_BLOB" = "$INDEX_BLOB" ]; then
              git checkout -- switch-inference.sh
            fi
          fi
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "Production checkout has tracked local changes; refusing to overwrite them."
            git status --short
            exit 1
          fi

          MODE="$(awk -F= '$1=="AWB_INFERENCE_MODE" {print $2}' .env | tail -n1)"
          MODE="${MODE:-local}"
          PORT="$(awk -F= '$1=="AWB_PORT" {print $2}' .env | tail -n1)"; PORT="${PORT:-8100}"
          OBSERVER_PORT="$(awk -F= '$1=="AWB_OBSERVER_PORT" {print $2}' .env | tail -n1)"; OBSERVER_PORT="${OBSERVER_PORT:-8101}"
          LAB_PORT="$(awk -F= '$1=="AWB_LAB_PORT" {print $2}' .env | tail -n1)"; LAB_PORT="${LAB_PORT:-8102}"

          # Existing autonomous research is never killed by an ordinary deploy.
          # This release contains a one-time marker because the user explicitly
          # requested the current research to be terminated for the UI rebuild.
          ACTIVE_JOBS=0
          if docker compose --env-file .env ps -q expert-my-rules 2>/dev/null | grep -q .; then
            ACTIVE_JOBS="$(docker compose --env-file .env exec -T expert-my-rules python - <<'PY'
          import sqlite3
          from pathlib import Path
          total = 0
          for db in Path('/data/workspaces').glob('*/ledger.sqlite3'):
              conn = sqlite3.connect(db, timeout=15)
              try:
                  total += conn.execute("SELECT COUNT(*) FROM jobs WHERE continuous=1 AND status IN ('RUNNING','QUEUED','PAUSED','CANCEL_REQUESTED')").fetchone()[0]
              finally:
                  conn.close()
          print(total)
          PY
            )"
            ACTIVE_JOBS="$(printf '%s' "$ACTIVE_JOBS" | tr -d '[:space:]')"
          fi

          if [ "$ACTIVE_JOBS" != "0" ] && [ "$FORCE_CANCEL" != "1" ]; then
            echo "Active autonomous research exists (${ACTIVE_JOBS} job(s)); safe deployment deferred. No process was interrupted."
            exit 0
          fi

          if [ "$FORCE_CANCEL" = "1" ]; then
            if docker compose --env-file .env ps -q expert-my-rules 2>/dev/null | grep -q .; then
              docker compose --env-file .env exec -T expert-my-rules python - <<'PY'
          import json, sqlite3
          from datetime import datetime, timezone
          from pathlib import Path
          now = datetime.now(timezone.utc).isoformat()
          cancelled = []
          reopened = []
          for db in Path('/data/workspaces').glob('*/ledger.sqlite3'):
              conn = sqlite3.connect(db, timeout=30)
              try:
                  jobs = conn.execute("SELECT id FROM jobs WHERE continuous=1 AND status IN ('RUNNING','QUEUED','PAUSED','CANCEL_REQUESTED')").fetchall()
                  for (jid,) in jobs:
                      conn.execute("UPDATE jobs SET status='CANCELLED', detail=?, updated_at=? WHERE id=?", ('terminated by authorized Control Center v2 rebuild', now, jid))
                      cancelled.append(f'{db.parent.name}:{jid}')
                  tasks = conn.execute("SELECT id,metadata_json FROM tasks WHERE status='IN_PROGRESS'").fetchall()
                  for task_id, metadata_json in tasks:
                      try: metadata = json.loads(metadata_json or '{}')
                      except Exception: metadata = {}
                      metadata['interrupt_recoveries'] = int(metadata.get('interrupt_recoveries', 0)) + 1
                      metadata['interrupted_by'] = 'authorized Control Center v2 rebuild'
                      conn.execute("UPDATE tasks SET status='OPEN', metadata_json=?, updated_at=? WHERE id=?", (json.dumps(metadata), now, task_id))
                      conn.execute("UPDATE attempts SET status='INTERRUPTED', error=CASE WHEN error='' THEN 'interrupted by authorized Control Center v2 rebuild' ELSE error END, finished_at=? WHERE task_id=? AND status='RUNNING'", (now, task_id))
                      reopened.append(f'{db.parent.name}:{task_id}')
                  conn.execute("INSERT INTO events(ts,kind,task_id,payload_json) VALUES(?,?,NULL,?)", (now, 'deployment_forced_cancel', json.dumps({'reason':'authorized Control Center v2 rebuild','cancelled_jobs':[x for x in cancelled if x.startswith(db.parent.name+':')],'reopened_tasks':[x for x in reopened if x.startswith(db.parent.name+':')]})))
                  conn.commit()
              finally:
                  conn.close()
          print('FORCED_CANCELLED_JOBS=' + json.dumps(cancelled))
          print('REOPENED_INTERRUPTED_TASKS=' + json.dumps(reopened))
          PY
            fi
            # Short timeout is intentional: the user explicitly authorized killing
            # the in-flight research. Durable ledgers were repaired just above.
            docker compose --env-file .env stop -t 2 expert-my-rules expert-observer 2>/dev/null || true
            rm -f workspaces/.awb-runtime-progress.json
          fi

          git fetch origin main
          git checkout main
          git reset --hard "${{ steps.rev.outputs.sha }}"
          docker network inspect home-lab >/dev/null 2>&1 || docker network create home-lab
          mkdir -p lab-data

          AWB_OLLAMA_CPU_FRACTION="$(awk -F= '$1=="AWB_OLLAMA_CPU_FRACTION" {print $2}' .env | tail -n1)"; AWB_OLLAMA_CPU_FRACTION="${AWB_OLLAMA_CPU_FRACTION:-0.85}"
          AWB_SIDE_PROJECT_CPU_FRACTION="$(awk -F= '$1=="AWB_SIDE_PROJECT_CPU_FRACTION" {print $2}' .env | tail -n1)"; AWB_SIDE_PROJECT_CPU_FRACTION="${AWB_SIDE_PROJECT_CPU_FRACTION:-0.15}"
          export AWB_OLLAMA_CPU_FRACTION AWB_SIDE_PROJECT_CPU_FRACTION
          export AWB_BUILD_SHA="${{ steps.rev.outputs.sha }}"
          POLICY_OUTPUT="$(bash ops/apply_acepc_resource_policy.sh)"
          printf '%s\n' "$POLICY_OUTPUT"
          AWB_OLLAMA_CPUS="$(printf '%s\n' "$POLICY_OUTPUT" | awk -F= '$1=="AWB_OLLAMA_CPUS" {print $2}' | tail -n1)"
          test -n "$AWB_OLLAMA_CPUS"
          export AWB_OLLAMA_CPUS

          if [ "$MODE" = "local" ]; then
            docker compose --env-file .env --profile local-inference build expert-my-rules
            docker compose --env-file .env --profile local-inference up -d --no-build --force-recreate ollama expert-my-rules expert-observer expert-lab
          elif [ "$MODE" = "remote" ]; then
            docker compose --env-file .env build expert-my-rules
            docker compose --env-file .env up -d --no-build --force-recreate expert-my-rules expert-observer expert-lab
          else
            echo "Unsupported AWB_INFERENCE_MODE=$MODE"
            exit 1
          fi

          # Migrate every existing project to expose LM Studio as a selectable
          # compute node without changing its current primary model route.
          docker compose --env-file .env exec -T expert-my-rules python - <<'PY'
          from pathlib import Path
          from awb.core.models import ComputeNodeSpec
          from awb.core.workspace import load_workspace, save_manifest
          for root in Path('/data/workspaces').iterdir():
              if not (root / 'project.yaml').exists():
                  continue
              ws = load_workspace(root)
              if not any(n.id == 'lm-studio' for n in ws.manifest.runtime.compute_nodes):
                  ws.manifest.runtime.compute_nodes.append(ComputeNodeSpec(
                      id='lm-studio', kind='lmstudio', base_url_env='LM_STUDIO_BASE_URL',
                      enabled=True, max_concurrency=1, priority=90,
                      tags=['local-or-lan', 'lm-studio'],
                  ))
                  save_manifest(ws)
                  print(f'Added selectable LM Studio node to {root.name}')
          PY

          MAIN_OK=0; OBS_OK=0; LAB_OK=0
          for _ in $(seq 1 90); do
            curl -fsS --max-time 3 "http://127.0.0.1:${PORT}/health" >/dev/null && MAIN_OK=1 || true
            curl -fsS --max-time 3 "http://127.0.0.1:${OBSERVER_PORT}/health" >/dev/null && OBS_OK=1 || true
            curl -fsS --max-time 3 "http://127.0.0.1:${LAB_PORT}/health" >/dev/null && LAB_OK=1 || true
            if [ "$MAIN_OK" = 1 ] && [ "$OBS_OK" = 1 ] && [ "$LAB_OK" = 1 ]; then break; fi
            sleep 2
          done
          if [ "$MAIN_OK" != 1 ] || [ "$OBS_OK" != 1 ] || [ "$LAB_OK" != 1 ]; then
            docker compose --env-file .env ps || true
            docker compose --env-file .env logs --tail=200 expert-my-rules expert-observer expert-lab || true
            exit 1
          fi

          # After a forced rebuild, old autonomous jobs must stay cancelled. The new
          # UI waits for the user to launch a new job explicitly.
          if [ "$FORCE_CANCEL" = 1 ]; then
            RUNNING_AFTER="$(docker compose --env-file .env exec -T expert-my-rules python - <<'PY'
          import sqlite3
          from pathlib import Path
          total=0
          for db in Path('/data/workspaces').glob('*/ledger.sqlite3'):
              conn=sqlite3.connect(db, timeout=15)
              try: total += conn.execute("SELECT COUNT(*) FROM jobs WHERE continuous=1 AND status IN ('RUNNING','QUEUED')").fetchone()[0]
              finally: conn.close()
          print(total)
          PY
            )"
            test "$(printf '%s' "$RUNNING_AFTER" | tr -d '[:space:]')" = "0"
          fi

          if [ "$MODE" = "local" ]; then
            NANO_CPUS="$(docker inspect --format '{{.HostConfig.NanoCpus}}' "$(docker compose --env-file .env ps -q ollama)")"
            echo "Ollama Docker NanoCpus=${NANO_CPUS}; requested logical CPUs=${AWB_OLLAMA_CPUS}."
          fi
          echo "CONTROL_CENTER_URL=http://127.0.0.1:${PORT}"
          echo "LIVE_DASHBOARD_URL=http://127.0.0.1:${OBSERVER_PORT}"
          echo "RESEARCH_LAB_URL=http://127.0.0.1:${LAB_PORT}"
          echo "Expert My Rules Control Center v2 deployed and healthy."
