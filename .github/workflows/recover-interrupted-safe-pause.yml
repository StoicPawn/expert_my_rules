name: recover-interrupted-safe-pause

on:
  push:
    branches: ["fix/inspection-review-correlation"]

permissions:
  contents: read

jobs:
  resume-interrupted-safe-pause:
    runs-on: [self-hosted, linux, expert-local]
    timeout-minutes: 10
    steps:
      - name: Restore the Kellerer continuous job if the cancelled deploy stranded it paused
        shell: bash
        env:
          DEPLOY_DIR: /home/stoicpawn/projects/expert_my_rules
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          test -f .env
          docker compose --env-file .env exec -T expert-my-rules python - <<'PY'
          import sqlite3
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('/data/workspaces')
          resumed = []
          observed = []
          for db in root.glob('*/ledger.sqlite3') if root.exists() else []:
              conn = sqlite3.connect(db, timeout=30)
              conn.row_factory = sqlite3.Row
              try:
                  theorem = conn.execute(
                      "SELECT id,title,status FROM tasks WHERE id='SEED-001' AND title LIKE '%central theorem%' LIMIT 1"
                  ).fetchone()
                  if theorem is None:
                      continue
                  job = conn.execute(
                      "SELECT id,status,detail,updated_at FROM jobs WHERE continuous=1 ORDER BY created_at DESC LIMIT 1"
                  ).fetchone()
                  observed.append((db.parent.name, dict(job) if job else None, dict(theorem)))
                  if job and job['status'] == 'PAUSED' and job['detail'] == 'paused by user':
                      now = datetime.now(timezone.utc).isoformat()
                      conn.execute(
                          "UPDATE jobs SET status='RUNNING', detail='recovered after cancelled safe deploy', updated_at=? WHERE id=?",
                          (now, job['id']),
                      )
                      conn.commit()
                      resumed.append((db.parent.name, job['id']))
              finally:
                  conn.close()
          for slug, job, theorem in observed:
              print(f"observed {slug} job={job} theorem={theorem}")
          for slug, job_id in resumed:
              print(f"resumed {slug} {job_id}")
          print(f"resumed_count={len(resumed)}")
          PY
