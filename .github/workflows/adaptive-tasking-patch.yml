name: adaptive-tasking-patch

on:
  push:
    branches: ["codex/adaptive-task-retry-semantics"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/adaptive-task-retry-semantics
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply semantic migration
        run: python scripts/apply_adaptive_tasking_patch.py
      - name: Validate patched tree
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m compileall -q src
          python -m unittest discover -s tests -v
      - name: Commit patched implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Implement adaptive scientific retry semantics"
          git push origin HEAD:codex/adaptive-task-retry-semantics
