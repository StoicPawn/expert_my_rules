services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  expert-my-rules:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./workspaces:/data/workspaces
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_BASE_URL=http://ollama:11434
      - AWB_LOCAL_MODEL=${AWB_LOCAL_MODEL:-qwen3:8b}
      - AWB_PLANNER_MODEL=${AWB_PLANNER_MODEL:-qwen3:8b}
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  ollama-models:
