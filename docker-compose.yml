services:
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-inference"]
    volumes:
      - ollama-models:/root/.ollama
    # Cap only the expensive inference engine. The deploy workflow computes 85%
    # of host logical CPUs; 3.4 is the four-core ACEPC fallback for manual starts.
    cpus: "${AWB_OLLAMA_CPUS:-3.4}"
    cpu_shares: 1024
    environment:
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-60s}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  expert-my-rules:
    build: .
    image: expert-my-rules-runtime:latest
    cpu_shares: 256
    ports:
      - "${AWB_PORT:-8100}:8000"
    volumes:
      - ./workspaces:/data/workspaces
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - AWB_RUNTIME_PROGRESS_FILE=/data/workspaces/.awb-runtime-progress.json
      - AWB_OLLAMA_READ_TIMEOUT_SECONDS=${AWB_OLLAMA_READ_TIMEOUT_SECONDS:-3600}
      - AWB_OLLAMA_STALL_CHECK_SECONDS=${AWB_OLLAMA_STALL_CHECK_SECONDS:-60}
      - AWB_OLLAMA_HEALTH_TIMEOUT_SECONDS=${AWB_OLLAMA_HEALTH_TIMEOUT_SECONDS:-5}
      - AWB_OLLAMA_HEALTH_FAILURES=${AWB_OLLAMA_HEALTH_FAILURES:-15}
      - AWB_OLLAMA_PROGRESS_EVENT_SECONDS=${AWB_OLLAMA_PROGRESS_EVENT_SECONDS:-60}
      - AWB_OLLAMA_MAX_OUTPUT_TOKENS=${AWB_OLLAMA_MAX_OUTPUT_TOKENS:-8192}
      - AWB_OLLAMA_DIRECTOR_MAX_OUTPUT_TOKENS=${AWB_OLLAMA_DIRECTOR_MAX_OUTPUT_TOKENS:-1200}
      - AWB_OLLAMA_WORKER_MAX_OUTPUT_TOKENS=${AWB_OLLAMA_WORKER_MAX_OUTPUT_TOKENS:-8192}
      - AWB_OLLAMA_REVIEWER_MAX_OUTPUT_TOKENS=${AWB_OLLAMA_REVIEWER_MAX_OUTPUT_TOKENS:-2200}
      - AWB_OLLAMA_VERIFIER_MAX_OUTPUT_TOKENS=${AWB_OLLAMA_VERIFIER_MAX_OUTPUT_TOKENS:-1200}
      - AWB_OLLAMA_DIRECTOR_THINK=${AWB_OLLAMA_DIRECTOR_THINK:-false}
      - AWB_OLLAMA_WORKER_THINK=${AWB_OLLAMA_WORKER_THINK:-true}
      - AWB_LOCAL_MODEL=${AWB_LOCAL_MODEL:-qwen3:4b}
      - AWB_PLANNER_MODEL=${AWB_PLANNER_MODEL:-qwen3:4b}
      - AWB_DIRECTOR_MODEL=${AWB_DIRECTOR_MODEL:-qwen3:4b}
      - AWB_WORKER_MODEL=${AWB_WORKER_MODEL:-qwen3:4b}
      - AWB_REVIEWER_MODEL=${AWB_REVIEWER_MODEL:-llama3.2:3b}
      - AWB_VERIFIER_MODEL=${AWB_VERIFIER_MODEL:-gemma3:4b}
      - AWB_OPENAI_DIRECTOR_MODEL=${AWB_OPENAI_DIRECTOR_MODEL:-gpt-5.6-terra}
      - AWB_OPENAI_DIRECTOR_REASONING=${AWB_OPENAI_DIRECTOR_REASONING:-low}
      - AWB_OPENAI_DIRECTOR_MAX_OUTPUT_TOKENS=${AWB_OPENAI_DIRECTOR_MAX_OUTPUT_TOKENS:-1200}
      - AWB_OPENAI_WORKER_MODEL=${AWB_OPENAI_WORKER_MODEL:-gpt-5.6-sol}
      - AWB_OPENAI_WORKER_REASONING=${AWB_OPENAI_WORKER_REASONING:-high}
      - AWB_OPENAI_WORKER_MAX_OUTPUT_TOKENS=${AWB_OPENAI_WORKER_MAX_OUTPUT_TOKENS:-8192}
      - AWB_OPENAI_REVIEWER_MODEL=${AWB_OPENAI_REVIEWER_MODEL:-gpt-5.6-sol}
      - AWB_OPENAI_REVIEWER_REASONING=${AWB_OPENAI_REVIEWER_REASONING:-high}
      - AWB_OPENAI_REVIEWER_MAX_OUTPUT_TOKENS=${AWB_OPENAI_REVIEWER_MAX_OUTPUT_TOKENS:-4096}
      - AWB_OPENAI_VERIFIER_MODEL=${AWB_OPENAI_VERIFIER_MODEL:-gpt-5.6-terra}
      - AWB_OPENAI_VERIFIER_REASONING=${AWB_OPENAI_VERIFIER_REASONING:-medium}
      - AWB_OPENAI_VERIFIER_MAX_OUTPUT_TOKENS=${AWB_OPENAI_VERIFIER_MAX_OUTPUT_TOKENS:-1800}
      - AWB_USD_PER_EUR=${AWB_USD_PER_EUR:-1.0}
      - AWB_BUILD_SHA=${AWB_BUILD_SHA:-unknown}
      - RESEARCH_LAB_URL=${RESEARCH_LAB_URL:-http://research-lab:8300}
      - RESEARCH_LAB_TOKEN=${RESEARCH_LAB_TOKEN:-}
      - TUTOR_LLM_URL=${TUTOR_LLM_URL:-http://tutor:8000}
      - TUTOR_LLM_TOKEN=${TUTOR_LLM_TOKEN:-}
    networks:
      - default
      - home-lab
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  expert-observer:
    image: expert-my-rules-runtime:latest
    cpu_shares: 128
    command: ["uvicorn", "awb.web.observer_app:observer_app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "${AWB_OBSERVER_PORT:-8101}:8001"
    volumes:
      - ./workspaces:/data/workspaces
    environment:
      - AWB_WORKSPACES_DIR=/data/workspaces
      - AWB_RUNTIME_PROGRESS_FILE=/data/workspaces/.awb-runtime-progress.json
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - AWB_RESOURCE_LABEL=${AWB_RESOURCE_LABEL:-ACEPC}
      - AWB_OPENAI_KEY_PRESENT=${OPENAI_API_KEY:+1}
      - AWB_OPENAI_DIRECTOR_MODEL=${AWB_OPENAI_DIRECTOR_MODEL:-gpt-5.6-terra}
      - AWB_OPENAI_DIRECTOR_REASONING=${AWB_OPENAI_DIRECTOR_REASONING:-low}
      - AWB_OPENAI_DIRECTOR_MAX_OUTPUT_TOKENS=${AWB_OPENAI_DIRECTOR_MAX_OUTPUT_TOKENS:-1200}
      - AWB_OPENAI_WORKER_MODEL=${AWB_OPENAI_WORKER_MODEL:-gpt-5.6-sol}
      - AWB_OPENAI_WORKER_REASONING=${AWB_OPENAI_WORKER_REASONING:-high}
      - AWB_OPENAI_WORKER_MAX_OUTPUT_TOKENS=${AWB_OPENAI_WORKER_MAX_OUTPUT_TOKENS:-8192}
      - AWB_OPENAI_REVIEWER_MODEL=${AWB_OPENAI_REVIEWER_MODEL:-gpt-5.6-sol}
      - AWB_OPENAI_REVIEWER_REASONING=${AWB_OPENAI_REVIEWER_REASONING:-high}
      - AWB_OPENAI_REVIEWER_MAX_OUTPUT_TOKENS=${AWB_OPENAI_REVIEWER_MAX_OUTPUT_TOKENS:-4096}
      - AWB_OPENAI_VERIFIER_MODEL=${AWB_OPENAI_VERIFIER_MODEL:-gpt-5.6-terra}
      - AWB_OPENAI_VERIFIER_REASONING=${AWB_OPENAI_VERIFIER_REASONING:-medium}
      - AWB_OPENAI_VERIFIER_MAX_OUTPUT_TOKENS=${AWB_OPENAI_VERIFIER_MAX_OUTPUT_TOKENS:-1800}
      - AWB_USD_PER_EUR=${AWB_USD_PER_EUR:-1.0}
      - AWB_BUILD_SHA=${AWB_BUILD_SHA:-unknown}
    networks:
      - default
      - home-lab
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  ollama-models:

networks:
  home-lab:
    external: true
    name: home-lab
