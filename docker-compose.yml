services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    environment:
      # Expert My Rules uses different model families sequentially. On small
      # machines, keep only one model resident at a time to bound RAM/VRAM.
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  expert-my-rules:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./workspaces:/data/workspaces
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_BASE_URL=http://ollama:11434
      # Heterogeneous local ensemble. Qwen builds; Llama attacks; Gemma checks.
      - AWB_LOCAL_MODEL=${AWB_LOCAL_MODEL:-qwen3:4b}
      - AWB_PLANNER_MODEL=${AWB_PLANNER_MODEL:-qwen3:4b}
      - AWB_DIRECTOR_MODEL=${AWB_DIRECTOR_MODEL:-qwen3:4b}
      - AWB_WORKER_MODEL=${AWB_WORKER_MODEL:-qwen3:4b}
      - AWB_REVIEWER_MODEL=${AWB_REVIEWER_MODEL:-llama3.2:3b}
      - AWB_VERIFIER_MODEL=${AWB_VERIFIER_MODEL:-gemma3:4b}
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  ollama-models:
