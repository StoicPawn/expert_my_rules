[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-workbench"
version = "0.1.0"
description = "Local-first autonomous project workbench with configurable agent loops, validators and completion gates."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "httpx>=0.27",
  "PyYAML>=6.0",
]

[project.scripts]
awb = "awb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
