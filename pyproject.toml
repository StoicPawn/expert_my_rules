[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-workbench"
version = "0.8.0"
description = "Local-first autonomous project workbench with liveness-based streaming inference, grounded scientific tools, adaptive compute routing, transactional workflows and conservative validation."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "python-multipart>=0.0.9",
  "ruff>=0.8",
]

[project.scripts]
awb = "awb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
